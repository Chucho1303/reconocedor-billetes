# Revisa semanalmente dependencias desactualizadas o con vulnerabilidades y abre PRs.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/Ejecucion"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: docker
    directory: "/Ejecucion"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(docker)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
